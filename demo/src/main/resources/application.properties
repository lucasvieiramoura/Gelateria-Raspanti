spring.application.name=gelateria-raspanti

## Configuração de Conexão com o Banco de Dados PostgresSQL
spring.datasource.url=jdbc:postgressql://localhost:5432/gelateria_raspanti
spring.datasource.username=postgressql
spring.datasource.password=postgressql

## Hibernate e JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## Variáveis  para SMS e Mercado Pago
sms.api.key=123456
mercadopago.access.token=TEST-SEU-TOKEN-MERCADO-Pago

## JWT Secret
jwt.secret=123456abcd